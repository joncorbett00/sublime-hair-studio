# Deploy to GitHub Pages
# Generated by `uniweb add ci --host=github-pages`. Safe to edit.

name: Deploy to GitHub Pages

on:
  push:
    # Both names are listed so the workflow fires whether the repo uses
    # 'main' (GitHub's current default) or 'master'. GHA only triggers on
    # a branch that exists, so the unused name is a harmless no-op. Users
    # on a different default (trunk, develop) edit this list directly.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve UNIWEB_BASE for this repo shape
        run: |
          REPO='${{ github.event.repository.name }}'
          if [[ "$REPO" == *.github.io ]]; then
            echo "UNIWEB_BASE=/" >> $GITHUB_ENV
          else
            echo "UNIWEB_BASE=/$REPO/" >> $GITHUB_ENV
          fi
      # Builds the foundation and both sites, with Bijou Boutique nested at
      # <base>shop/ inside Sublime's output (scripts/build.mjs).
      - run: pnpm build --host=github-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/sublime/dist
      - id: deployment
        uses: actions/deploy-pages@v4
