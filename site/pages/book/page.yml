title: Book
# The header already carries the loud "Book now" button; a second, quieter
# "Book" link beside it only splits the click. Still listed in the footer.
hideIn: [header]
description: >-
  Book an appointment at Sublime Hair Studio.

# Bookings, deposits and no-show fees are all Square Appointments. Every "Book"
# link on the site points at /book, so this is the ONE place the Square address
# lives. Replace it with the studio's booking page: Square Dashboard →
# Appointments → Online booking → copy the booking site link.
redirect: https://book.squareup.com/appointments/REPLACE-WITH-SQUARE-BOOKING-ID
