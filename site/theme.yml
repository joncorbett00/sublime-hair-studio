# Sublime Hair Studio — "Front Row"
# One loud colour and a wardrobe of neutrals. Vermilion, the studio's red, is
# the only colour in the house, and whole sections are set in it; everything
# else is bone paper, sand, taupe and near-black ink, with Archivo for
# headlines and text, and a Bodoni wordmark.

colors:
  primary: '#C8401F'      # vermilion — the brand red, booking buttons, colour-block sections
  secondary: '#8C7B6B'    # taupe — a neutral, for anything the kit calls secondary
  accent: '#C8401F'       # the same vermilion: there is one colour, not two
  neutral: stone          # warm greys

contexts:
  light:
    section: '#F6F0E6'    # bone paper
    card: '#FFFCF6'
    border: '#DDD0BE'
    heading: '#17120F'
    body: '#3E352F'
    subtle: '#6F6259'
  medium:
    section: '#ECE3D6'    # sand
    card: '#F6F0E6'
    border: '#D6C8B5'
    heading: '#17120F'
    body: '#3E352F'
    subtle: '#66584D'
  dark:
    section: '#17120F'    # ink
    card: '#231C18'
    border: '#3B312B'
    heading: '#F6F0E6'
    body: '#D9CEC2'
    subtle: '#A89A8E'
    primary: primary-500
    primary-hover: primary-400

# One look, chosen on purpose.
appearance:
  default: light
  allowToggle: false
  respectSystemPreference: false

# One reading family, Archivo, for headings and text. Bodoni Moda is loaded
# for the wordmark and seal only (italic, one weight). To change the headline
# face, change `font-display` in foundation/main.js too.
fonts:
  heading: "'Archivo', ui-sans-serif, system-ui, sans-serif"
  body: "'Archivo', ui-sans-serif, system-ui, sans-serif"
  import:
    - url: "https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&display=swap"

# `[words]{accent}` in a heading: italic in vermilion with a squiggle
# under it (styles.css). Brighter red on ink, and ink on vermilion sections.
inline:
  accent: { color: 'var(--accent-ink)', font-style: 'italic' }
  callout: { color: 'var(--primary)', font-weight: '600' }

vars:
  radius: 0rem
