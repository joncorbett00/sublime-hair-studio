name: Sublime Hair Studio
defaultLanguage: en

foundation: foundation
index: home

# `book` redirects to Square Appointments (pages/book/page.yml). The shop is
# Bijou Boutique, its own site (sites/bijou) served under /shop/ on this domain
# — linked from the header and footer, not a page here.
pages: [home, services, colour, crew, book, visit]

keywords: [hair studio ottawa, hair salon ottawa, elgin street hair salon, golden triangle salon, lunch hour haircut ottawa, balayage ottawa, creative colour, centretown hair, curly cuts ottawa, vivid hair colour ottawa, colour correction ottawa, pastel hair colour]

seo:
  # Also set in vite.config.js — the build reads it from there, not here.
  baseUrl: https://sublimehair.ca
  description: >-
    Sublime Hair Studio — a warm, second-floor hair studio just off Elgin Street in Ottawa's
    Golden Triangle. Runway-trained cuts, colour, blowouts and up-dos, plus 45-minute
    lunch-hour cuts for downtown professionals.
  # Absolute, and a PNG: Facebook, iMessage and Slack will not show an SVG card.
  image: https://sublimehair.ca/images/og-default.png

# The business as Google should see it. The footer turns this into HairSalon
# structured data on every page, so it must match the Google Business Profile
# exactly — same name, address, phone and hours. The visible hours are in
# layout/footer.md and pages/visit/1-visit.md; change all three together.
business:
  type: HairSalon
  name: Sublime Hair Studio
  url: https://sublimehair.ca
  telephone: "+1-613-567-7400"
  email: hello@sublimehair.ca
  image: https://sublimehair.ca/images/logo.png
  address:
    street: 190 MacLaren Street
    city: Ottawa
    region: ON
    postalCode: K2P 0L6
    country: CA
  geo: { lat: 45.4157, lng: -75.6928 }
  # 24-hour times. Days not listed are closed.
  hours:
    - { days: [Tuesday, Wednesday, Thursday, Friday, Saturday], opens: "12:00", closes: "18:00" }
  # Every profile that is this business. Add the Google Business Profile link
  # (GBP → Share → copy link) and the real Instagram when there is one.
  sameAs:
    - https://www.facebook.com/ottawasublimehair/

# Square Appointments. `services` is the booking site's service list; a
# service's Book button adds its `square:` ID to the end of this to open that
# service directly (collections/services/cuts.yml). pages/book/page.yml
# redirects to the same address — change both together.
booking:
  services: https://book.squareup.com/appointments/oht393d65ci9ue/location/LKMKJ3HW3C5XP/services

# The records (records/) and the queries that reach them are in queries.yml.

build:
  prerender: true
