# Real reviews from the studio's clients, word for word from the old site's
# "Happy Clients" section. They carry no star rating or date, so the cards
# show neither.
#
# Fields: `author`, `text`, and optionally `rating` (1–5, shows stars),
# `date` (YYYY-MM-DD, shows "3 months ago") and `source` ("Google review").
# The Testimonials section drops a review below its `minRating` or older than
# its `maxAgeMonths` only when the review has a rating or a date to judge.
- slug: lindsay
  author: Lindsay
  text: "I love going to Sublime! They are great and always make my hair look amazing!! I’ve been going for 3 years and I’ll never go anywhere else! I’ve referred a ton of friends and they’ve all loved it too! Best hair salon in Ottawa!"
- slug: bridget
  author: Bridget
  text: "My friend recommended Sonia to me and I have been going there for several years - with great satisfaction. I have thick, curly difficult hair and Sonia understood from the start how to cut it to suit my face. I never feel pressured to do things with my hair that aren't my kind of thing - Sonia gets it. I agree with another reviewer - don't go in a rush. They take time to do a great job."
- slug: philippe
  author: Philippe
  text: "The staff are extremely professional and welcoming. The stylists are also exceptionally talented and skills in their craft. Each haircut is honestly one of the best I've ever had!"
- slug: cameron
  author: Cameron
  text: "Sonia at sublime hair studio is awesome. She loves what she does an puts so much effort into her work. So happy i found her. Everyone there is so friendly. Totally recommend checking them out :)"
