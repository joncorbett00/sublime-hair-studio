author: Bridget
text: >-
  My friend recommended Sonia to me and I have been going there for several
  years - with great satisfaction. I have thick, curly difficult hair and Sonia
  understood from the start how to cut it to suit my face. I never feel
  pressured to do things with my hair that aren't my kind of thing - Sonia gets
  it. I agree with another reviewer - don't go in a rush. They take time to do a
  great job.
