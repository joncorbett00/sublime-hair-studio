- slug: jules
  title: Jules Tremblay
  role: Senior Stylist & Colourist
  pronouns: they/them
  image: https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&crop=faces&w=900&h=1125&q=80
  tagline: Will talk you out of a bad idea, then execute a better one.
  bio: >-
    Jules is the person you book when you want something vivid and want it to still look good in
