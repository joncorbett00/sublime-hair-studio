title: Sonia
role: Owner & Senior Stylist
pronouns: she/her
image: /images/crew/sonia.webp
tagline: Apprenticed at 13, trained with the best. Still happiest behind her own chair.
bio: >-
  Sonia started her apprenticeship at thirteen among European hairstylists and
  went on to learn from Vidal Sassoon, Toni & Guy London, Schwarzkopf, Alain
  Larivée and Anthony Edge. She came home from New York in the early 2000s set
  on a salon with a SoHo loft's obsession for style and service, minus the
  attitude. She excels at men's hair and barbering, and is a true alchemist with
  colour.
specialties:
  - Colour correction
  - Creative colour
  - Curly cutting
favouriteThing: The exact moment someone sees the back of their head in the mirror.
worstHaircut: Self-administered, 2009, kitchen scissors, still discussed at family dinners.
level: Senior
levelSurcharge: 20
order: 1
