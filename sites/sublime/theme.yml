# Sublime Hair Studio — "Front Row"
# One loud colour and a wardrobe of neutrals. Vermilion, the studio's red, is
# the only colour in the house, and whole sections are set in it; everything
# else is bone paper, sand, taupe and near-black ink, with Archivo for
# everything you read (headlines in its semi-condensed cut) and Black Mango
# kept for the seal's letter.

colors:
  primary: '#e19e27'      # vermilion — the brand red, booking buttons, colour-block sections
  secondary: '#8C7B6B'    # taupe — a neutral, for anything the kit calls secondary
  accent: '#e8e8e8'       # the same vermilion: there is one colour, not two
  neutral: '#8C7B6B'      # taupe — the warm grey every surface and text colour is cut from

# Every surface and every text colour below is cut from the neutral palette
# (`colors.neutral`), through the house vars in foundation/main.js — paper,
# sand and ink — so changing the neutral changes the whole page with it.
contexts:
  light:
    section: var(--paper)     # bone paper
    card: 'color-mix(in oklch, white, var(--neutral-50) 25%)'
    border: var(--sand-muted)
    heading: var(--ink)
    body: neutral-800
    subtle: 'color-mix(in oklch, var(--neutral-600), var(--neutral-700) 25%)'
  medium:
    section: 'color-mix(in oklch, var(--neutral-100), var(--neutral-200) 25%)'   # sand
    card: var(--paper)
    border: 'color-mix(in oklch, var(--neutral-200), var(--neutral-300) 50%)'
    heading: var(--ink)
    body: neutral-800
    subtle: var(--sand-subtle)
  dark:
    section: var(--ink)       # ink
    card: var(--ink-card)
    border: var(--ink-border)
    heading: var(--paper)
    body: var(--ink-body)
    subtle: var(--ink-subtle)
    primary: primary-500
    primary-hover: primary-400

# One look, chosen on purpose.
appearance:
  default: light
  allowToggle: false
  respectSystemPreference: false

# Archivo throughout: text and capital-letter labels at its normal width,
# headlines, numbers and prices in its semi-condensed cut (`display-stretch`
# under vars:, below). Black Mango (Creative Media Lab) is kept only for the
# letter in the turning seal — the face of the logo. It read beautifully at
# logo size but made headlines hard to read.
#
# Black Mango is a commercial font; the file is
# public/fonts/BlackMango-Regular.woff2. `display` is the foundation's
# headline face (`font-display` in foundation/main.js); `heading` is h1–h3;
# `logo` is the seal's letter.
fonts:
  heading: "'Archivo', ui-sans-serif, system-ui, sans-serif"
  display: "'Archivo', ui-sans-serif, system-ui, sans-serif"
  logo: "'Black Mango', ui-serif, Georgia, serif"
  body: "'Archivo', ui-sans-serif, system-ui, sans-serif"
  import:
    - url: "https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
  faces:
    - { family: "Black Mango", src: /fonts/BlackMango-Regular.woff2, weight: "400" }

# `[words]{accent}` in a heading: italic in vermilion with a squiggle
# under it (styles.css). Brighter red on ink, and ink on vermilion sections.
inline:
  accent: { color: 'var(--accent-ink)', font-style: 'italic' }
  callout: { color: 'var(--primary)', font-weight: '600' }

vars:
  radius: 0rem

  # Headlines in Archivo's semi-condensed cut, so they read as a face of
  # their own beside the body text.
  display-stretch: 87.5%
