# Bijou Boutique — "Curated Apparel"
# Sister to Sublime Hair Studio's "Front Row": the same wardrobe of neutrals
# and the same rule of one loud colour. Sublime's is vermilion; Bijou's is a
# cut-emerald green, with champagne for the accent word on the green only.
# Ivory paper, sand and a green-black ink; Archivo for headlines and text.
# The logo is the round badge (public/images/bijou-logo.png).

colors:
  primary: '#ff0000'      # jewel green — buttons, the film-strip edge, colour-block sections
  secondary: '#8C7B6B'    # a green-grey neutral, for anything the kit calls secondary
  accent: '#00ff43'       # the same green: there is one colour, not two
  neutral: '#8C7B6B'      # green-grey — every surface and text colour is cut from it

# Every surface and every text colour below is cut from the neutral palette
# (`colors.neutral`), through the house vars in foundation/main.js — paper,
# sand and ink — so changing the neutral changes the whole page with it.
contexts:
  light:
    section: var(--paper)     # ivory paper
    card: 'color-mix(in oklch, white, var(--neutral-50) 25%)'
    border: var(--sand-muted)
    heading: var(--ink)
    body: 'neutral-800'
    subtle: 'color-mix(in oklch, var(--neutral-600), var(--neutral-700) 25%)'
  medium:
    section: 'color-mix(in oklch, var(--neutral-100), var(--neutral-200) 25%)'   # sand
    card: var(--paper)
    border: 'color-mix(in oklch, var(--neutral-200), var(--neutral-300) 50%)'
    heading: var(--ink)
    body: 'neutral-800'
    subtle: 'var(--sand-subtle)'
  dark:
    section: var(--ink)       # ink
    card: var(--ink-card)
    border: 'var(--ink-border)'
    heading: var(--paper)
    body: var(--ink-body)
    subtle: var(--ink-subtle)
    primary: primary-500
    primary-hover: primary-400

# One look, chosen on purpose.
appearance:
  default: light
  allowToggle: false
  respectSystemPreference: false

# One reading family, Archivo, for headings and text. Bodoni Moda is loaded
# for the wordmark and seal only (italic, one weight). To change the headline
# face, change `font-display` in foundation/main.js too.
fonts:
  heading: "'Archivo', ui-sans-serif, system-ui, sans-serif"
  body: "'Archivo', ui-sans-serif, system-ui, sans-serif"
  import:
    - url: https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap
  display: '''Archivo'', ui-sans-serif, system-ui, sans-serif'

# `[words]{accent}` in a heading: italic in the green with a squiggle under it
# (styles.css). Brighter green on ink, champagne on the green.
inline:
  accent: { color: 'var(--accent-ink)', font-style: 'italic' }
  callout: { color: 'var(--primary)', font-weight: '600' }

vars:
  radius: 0rem

  # A taller masthead than Sublime's, so the round badge (layout/header.md
  # `logo:`) is big enough to read.
  header-height: 6.75rem

  # Labels, buttons and nav in Archivo's wide cut (Sublime uses the body face
  # at its normal width, the foundation default). 100% to match Sublime.
  label-stretch: 125%

  # The house colours (declared in foundation/main.js) are cut from the
  # theme's palettes, so they follow them: paper, sand, ink and the ink and
  # sand blocks from `colors.neutral`; the one loud colour and its shades from
  # `colors.primary`. Only the lifted shade is set here: a dark green needs a
  # lighter step than the default to read on ink.
  brand-bright: 'color-mix(in oklch, var(--primary-300), var(--primary-400))'
  # The accent word on ink, lifted the same way.
  accent-on-ink: var(--brand-bright)
  # Champagne: the glint that only ever appears on the green — the accent
  # word, the focus ring and the seal's initial.
  on-brand-accent: '#E6CD93'
  on-brand-ring: '#E6CD93'
  seal-letter: '#E6CD93'
  display-stretch: 87.5%
